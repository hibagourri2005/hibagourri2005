name: Generate Snake

on:
  # Rafraîchit le snake toutes les 12h
  schedule:
    - cron: "0 */12 * * *"
  # Permet de le déclencher manuellement depuis l'onglet Actions
  workflow_dispatch:
  # Se déclenche aussi à chaque push sur main
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#a8e063
            dist/snake-dark.svg?palette=github-dark&color_snake=#d4fc79

      - name: Push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
